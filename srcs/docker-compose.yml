version: '3.8'

services:
  mariadb:
    container_name: mariadb
    build: requirements/mariadb/.
    restart: always
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
  
  wordpress:
    depends_on:
      - mariadb
    container_name: wordpress
    build: requirements/wordpress/.
    restart: always
    env_file:
      - .env
    expose:
      - 9000
    volumes:
      - wordpress:/var/www/html 
    networks:
      - inception
  
  # nginx:
  #   container_name: nginx
  #   image: nginx:latest
  #   restart: always
  #   depends_on:
  #     - wordpress
  #   env_file:
  #     - .env
  #   ports:
  #     - "80:80"
  #   networks:
  #     - inception
  #   volumes:
  #     - ./default.conf:/etc/nginx/conf.d/default.conf
  #     - wordpress:/var/www/html
  nginx:
    container_name: nginx
    build: requirements/nginx/.
    restart: always
    depends_on:
      - wordpress
    env_file:
      - .env
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress:/var/www/html
  
  ftp:
    container_name: ftp
    build: requirements/bonus/ftp/.
    restart: always
    env_file:
      - .env
    ports:
      - "21:21"
      - "30000-30100:30000-30100" # passive FTP port range
    networks:
      - inception
    volumes:
      - wordpress:${FTP_DIR}

  adminer:
    container_name: adminer
    build: requirements/bonus/adminer/.
    restart: always
    ports:
      - "8080:8080"
    networks:
      - inception
  
  redis:
    container_name: redis
    build: requirements/bonus/redis/.
    restart: always
    networks:
      - inception

  portainer:
    container_name: portainer
    build: requirements/bonus/portainer/.
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - inception
  
  web:
    container_name: web
    build: requirements/bonus/web/.
    ports:
      - "3000:80"
    networks:
      - inception

networks:
  inception:
    driver: bridge

volumes:
  wordpress:
  db_data:
  portainer_data:


# volumes:
#   wordpress:
#     driver: local
#     driver_opts:
#       type: none
#       device: /home/login/data   # Path on the host system
#       o: bind


# driver: local: Uses the host's local filesystem to manage the volume's data.
# The bind mount (o: bind) ensures that the data from the host 
# directory is directly mapped into the container, so changes to the host 
# directory reflect immediately inside the container.