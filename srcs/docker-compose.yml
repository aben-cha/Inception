
services:
  mariadb:
    container_name: mariadb
    build: requirements/mariadb/.
    restart: always
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - DB:/var/lib/mysql
    networks:
      - inception
  
  wordpress:
    depends_on:
      - mariadb
    container_name: wordpress
    build: requirements/wordpress/.
    restart: always
    env_file:
      - .env
    expose:
      - 9000
    volumes:
      - WordPress:/var/www/html 
    networks:
      - inception

  nginx:
    container_name: nginx
    build: requirements/nginx/.
    restart: always
    depends_on:
      - wordpress
    env_file:
      - .env
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - WordPress:/var/www/html
  
  ftp:
    container_name: ftp
    build: requirements/bonus/ftp/.
    restart: always
    env_file:
      - .env
    ports:
      - "21:21"
      - "30000-30100:30000-30100"
    networks:
      - inception
    volumes:
      - WordPress:${FTP_DIR}

  adminer:
    container_name: adminer
    build: requirements/bonus/adminer/.
    restart: always
    ports:
      - "8080:8080"
    networks:
      - inception
  
  redis:
    container_name: redis
    build: requirements/bonus/redis/.
    restart: always
    networks:
      - inception

  portainer:
    container_name: portainer
    build: requirements/bonus/portainer/.
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - portainer_data:/data
    networks:
      - inception
  
  web:
    container_name: web
    build: requirements/bonus/web/.
    ports:
      - "3000:80"
    networks:
      - inception

networks:
  inception:
    driver: bridge

volumes:
  DB:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aben-cha/data/db
  WordPress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aben-cha/data/wordpress