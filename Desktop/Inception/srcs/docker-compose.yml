services:
  mariadb:
    container_name: mariadb
    build: requirements/mariadb/
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
  wordpress:
    depends_on:
      - mariadb
    container_name: wordpress
    build: requirements/wordpress/
    env_file:
      - .env
    expose:
      - 9000
    volumes:
      - wordpress:/var/www/html 
    networks:
      - inception
  nginx:
    container_name: nginx
    image: nginx:latest
    depends_on:
      - wordpress
    env_file:
      - .env
    ports:
      - "80:80"
    networks:
      - inception
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - wordpress:/var/www/html 
  ftp-server:
    container_name: ftp-server
    build: requirements/bonus/ftp/
    env_file:
      - .env
    ports:
      - "21:21"
      - "10000-10100:10000-10100" # passive FTP port range
    networks:
      - inception
    volumes:
      - wordpress:/home/${FTP_USER}/ftp/files
networks:
  inception:
    driver: bridge

volumes:
  wordpress:
  db_data:
    