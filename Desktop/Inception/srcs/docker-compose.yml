services:
  mariadb:
    container_name: mariadb
    build: requirements/mariadb/
    restart: always
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
  wordpress:
    depends_on:
      - mariadb
    container_name: wordpress
    build: requirements/wordpress/
    restart: always
    env_file:
      - .env
    expose:
      - 9000
    volumes:
      - wordpress:/var/www/html 
    networks:
      - inception
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: always
    depends_on:
      - wordpress
    env_file:
      - .env
    ports:
      - "80:80"
    networks:
      - inception
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - wordpress:/var/www/html 
  # ftp-server:
  #   container_name: ftp-server
  #   build: requirements/bonus/ftp/
  #   restart: always
  #   env_file:
  #     - .env
  #   ports:
  #     - "21:21"
  #     - "10000-10100:10000-10100" # passive FTP port range
  #   networks:
  #     - inception
  #   volumes:
  #     - wordpress:/home/${FTP_USER}/ftp/files
  adminer:
    container_name: adminer
    build: requirements/bonus/adminer/
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DESIGN=mvt
    networks:
      - inception

networks:
  inception:
    driver: bridge

volumes:
  wordpress:
  db_data:
    